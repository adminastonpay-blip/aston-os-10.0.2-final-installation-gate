name = "bold-river-9b3b"
main = "src/index.js"
compatibility_date = "2026-10-14"
workers_dev = true
upload_source_maps = true

[observability]
enabled = true

[ai]
binding = "AI"

[vars]
ASTON_BRAND_NAME = "ASTON OS"
ASTON_TENANT_ID = "default"
ASTON_AI_GATEWAY = "default"
ASTON_RATE_LIMIT = "60"
ASTON_TURNSTILE_ENFORCE = "0"
ASTON_MODERATION = "1"

[env.staging]
name = "bold-river-9b3b-staging"
workers_dev = true
[env.staging.vars]
ASTON_BRAND_NAME = "ASTON OS"
ASTON_TENANT_ID = "aston-staging"
ASTON_AI_GATEWAY = "default"
ASTON_RATE_LIMIT = "30"
ASTON_TURNSTILE_ENFORCE = "0"
ASTON_MODERATION = "1"

[env.production]
name = "bold-river-9b3b"
workers_dev = true
[env.production.vars]
ASTON_BRAND_NAME = "ASTON OS"
ASTON_TENANT_ID = "default"
ASTON_AI_GATEWAY = "default"
ASTON_RATE_LIMIT = "60"
ASTON_TURNSTILE_ENFORCE = "0"
ASTON_MODERATION = "1"
